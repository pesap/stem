[tools]
node = "24.21.0"

[tasks.format]
description = "Format TypeScript source and project configuration"
run = "npm run format"

[tasks.fmt-check]
description = "Check formatting"
run = "npm run format:check"

[tasks.typecheck]
description = "Type-check source and tests"
run = "npm run typecheck"

[tasks.test]
description = "Run CLI and rendering tests"
run = "npm test"

[tasks.build]
description = "Build the TypeScript CLI"
run = "npm run build"
sources = ["src/**/*.ts", "tsconfig.json", "package.json", "package-lock.json"]
outputs = ["dist/**/*.js"]

[tasks.pack-check]
description = "Inspect the npm package contents"
run = "npm pack --dry-run"

[tasks.cli]
description = "Launch the interactive CLI wizard"
depends = ["build"]
interactive = true
run = "node dist/cli.js"

[tasks.example]
description = "Generate both example Julia scripts"
depends = ["example:single", "example:sequential"]

[tasks."example:single"]
description = "Generate a single-step Julia example"
depends = ["build"]
run = """
node dist/cli.js \
  --input /path/to/system.json \
  --output generated/decision_model.jl \
  --config examples/decision_model.toml \
  --no-prompt \
  --yes
"""

[tasks."example:sequential"]
description = "Generate a sequential simulation Julia example"
depends = ["build"]
run = """
node dist/cli.js \
  --output generated/sequential_simulation.jl \
  --config examples/sequential_simulation.toml \
  --no-prompt \
  --yes
"""
