name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build CLI
        run: npm run build

      - name: Smoke-test the packed npm package
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d "$RUNNER_TEMP/stem-package.XXXXXX")"
          mkdir -p "$test_dir/package" "$test_dir/install"
          tarball="$(npm pack --pack-destination "$test_dir/package" --silent)"
          npm install --prefix "$test_dir/install" --ignore-scripts --no-save "$test_dir/package/$tarball"
          stem="$test_dir/install/node_modules/.bin/stem"
          "$stem" --help > "$test_dir/help.txt"
          grep -q 'Usage: stem' "$test_dir/help.txt"
          actual_version="$("$stem" --version)"
          expected_version="$(node -p "require('./package.json').version")"
          test "$actual_version" = "$expected_version"
          printf '%s\n' '{"data":{"components":[]}}' > "$test_dir/system.json"
          "$stem" \
            --input "$test_dir/system.json" \
            --output "$test_dir/decision-model.jl" \
            --config "$GITHUB_WORKSPACE/examples/decision_model.toml" \
            --no-prompt --yes
          test -s "$test_dir/decision-model.jl"
          "$stem" \
            --output "$test_dir/sequential-simulation.jl" \
            --config "$GITHUB_WORKSPACE/examples/sequential_simulation.toml" \
            --no-prompt --yes
          test -s "$test_dir/sequential-simulation.jl"
