name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Expected release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release package
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  metadata:
    name: Verify release metadata
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check npm trusted-publishing requirements
        run: |
          npm_version="$(npm --version)"
          echo "Using npm $npm_version"
          if ! node -e '
            const version = process.argv[1].split(".").map(Number);
            const [major, minor, patch] = version;
            const supported = version.length === 3 && version.every(Number.isInteger) &&
              (major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))));
            if (!supported) process.exit(1);
          ' "$npm_version"; then
            echo "npm $npm_version is too old for trusted publishing. Use npm 11.5.1 or newer." >&2
            exit 1
          fi

      - name: Check package name and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_name" != "@pesap/stem" ]]; then
            echo "Expected npm package @pesap/stem, got $package_name" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: [verify, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish with npm trusted publishing
        run: npm publish --access public
