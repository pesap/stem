name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Expected release tag, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release package
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  metadata:
    name: Verify release metadata
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check package name, registry, and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_registry="$(node -p "require('./package.json').publishConfig.registry")"
          if [[ "$package_name" != "@gpac/stem" ]]; then
            echo "Expected npm package @gpac/stem, got $package_name" >&2
            exit 1
          fi
          if [[ "$package_registry" != "https://npm.github.nrel.gov/" ]]; then
            echo "Expected internal npm registry, got $package_registry" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $RELEASE_TAG is not a vX.Y.Z version tag" >&2
            exit 1
          fi

  publish:
    name: Publish to internal npm
    if: github.event_name == 'release'
    needs: [verify, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://npm.github.nrel.gov/"
          scope: "@gpac"

      - name: Check internal registry token
        env:
          NREL_NPM_TOKEN: ${{ secrets.NREL_NPM_TOKEN }}
        run: |
          if [[ -z "$NREL_NPM_TOKEN" ]]; then
            echo "Set the NREL_NPM_TOKEN repository Actions secret to a github.nrel.gov package-write token." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          npm version "$tag_version" --no-git-tag-version --allow-same-version

      - name: Build package before registry authentication
        run: npm run build

      - name: Verify internal registry credentials
        run: npm whoami --registry=https://npm.github.nrel.gov/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NREL_NPM_TOKEN }}

      - name: Publish package
        run: npm publish --ignore-scripts --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NREL_NPM_TOKEN }}
